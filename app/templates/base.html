<html>
    <head>        
        {% if title %}
        <title>{{ title}} - Flask app</title>
        {% else %}
        <title>Flask app</title>
        {% endif %}
    </head>
    <body>        
        <div>Flask App:
            <a href="/index">Home Page</a>
            <a href="/login">Enter</a>
        </div>                
        <hr>
        {% with messages = get_flashed_messages %}
        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}            
        </ul>
        {% endif %}
        {% endwith %}            
        {% block content %}{% endblock %}
    </body>
</html>
