{% extends "base.html" %}

{% block content%}
    <h1>Enter</h1>    
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.username.lable }}<br>
            {{ form.username(size=32) }}
        </p>
        <p>
            {{ form.password.lable }}<br>
            {{ form.password(size=32) }}
        </p>
        <p>{{ form.remeber_me() }} {{ form.remember_me.label }}</p>
        <p>{{ form.submit() }} </p>
    </form>    
{% endblock %}
